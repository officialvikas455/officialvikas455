<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#161B33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C170" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E8C170" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#7DD3FC" opacity="0.18"/>
    </pattern>
    <clipPath id="roundedCorners">
      <rect x="0" y="0" width="1200" height="300" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCorners)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#dotGrid)"/>
    <circle cx="230" cy="150" r="220" fill="url(#glow)"/>
    <circle cx="1020" cy="200" r="180" fill="url(#glowBlue)"/>
    <rect x="0" y="0" width="1200" height="4" fill="#E8C170" opacity="0.85"/>

    <!-- decorative code window -->
    <g transform="translate(940,46)" opacity="0.95">
      <rect x="0" y="0" width="220" height="130" rx="10" fill="#0D1424" stroke="#2A3356" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="28" rx="10" fill="#151C33"/>
      <rect x="0" y="18" width="220" height="10" fill="#151C33"/>
      <circle cx="18" cy="14" r="5" fill="#EF4444"/>
      <circle cx="36" cy="14" r="5" fill="#F59E0B"/>
      <circle cx="54" cy="14" r="5" fill="#22C55E"/>
      <text x="18" y="52" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12" fill="#7DD3FC">const dev = {</text>
      <text x="30" y="72" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12"><tspan fill="#E8C170">role:</tspan><tspan fill="#F8FAFC"> 'SDE',</tspan></text>
      <text x="30" y="92" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12"><tspan fill="#E8C170">rating:</tspan><tspan fill="#F8FAFC"> 1617</tspan></text>
      <text x="18" y="112" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12" fill="#7DD3FC">};</text>
      <rect x="34" y="102" width="6" height="12" fill="#E8C170">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="1000" y="292" font-family="Consolas, Monaco, monospace" font-size="34" fill="#7DD3FC" opacity="0.14">&lt;/&gt;</text>

    <!-- eyebrow -->
    <text x="80" y="98" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" letter-spacing="4" fill="#7DD3FC">MERN STACK DEVELOPER · SDE ASPIRANT</text>

    <!-- name -->
    <text x="78" y="170" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="58" font-weight="700" fill="#F8FAFC">Vikas Gangwar</text>

    <!-- gold underline -->
    <rect x="80" y="188" width="190" height="4" rx="2" fill="#E8C170"/>

    <!-- tagline -->
    <text x="80" y="228" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#94A3B8">Full-Stack Engineer · Competitive Programmer · Open to SDE Roles</text>

    <!-- blinking cursor -->
    <rect x="738" y="212" width="11" height="20" fill="#E8C170">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="297" width="1200" height="3" fill="#2A3356"/>
  </g>
</svg>
